    <link rel="icon" href="/favicon.ico" sizes="32x32" />

  <body>
    <!-- une planche de créatures en caractères, pour en choisir une (voir src/features/creatures) -->
    <main class="cr carnet-sheet">
      <header class="cr-head">
        <h1 class="cr-title">Créatures</h1>
        <p class="cr-lead">Quarante propositions pour habiter Ruban. Chacune passe par ses poses : au repos, en marche, en plein saut, en train de grimper. Clique sur celles qui te plaisent.</p>
        <p class="cr-picked" aria-live="polite"></p>
      </header>
      <ol class="cr-grid"></ol>
    </main>
    <script type="module" src="/src/features/creatures/main.ts"></script>
