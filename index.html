<!-- The home page (its code: src/home/, see main.ts): the project badges, and behind them Garance's places in relief;
     hovering a badge leads to its place and writes its sentence, a click keeps it with its links. The lab opens in the
     page itself (?labo): the backdrop never reloads. The visible text is in French. -->
<script>
  // the light of the hour it is in Paris (see src/home/time-of-day.ts; ?hour=22 to try an hour), picked before anything
  // shows: arriving on the home page (not in the lab, nor by an old link to a project), the poster, an image of the sea of clouds
  // in that light, shows at once; the live backdrop fades over it
  ;(() => {
    const asked = new URLSearchParams(location.search).get('hour')
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date())
    const at = (type) => +parts.find((x) => x.type === type).value
    const hour = asked !== null && asked !== '' && !isNaN(+asked) ? +asked % 24 : at('hour') + at('minute') / 60
    const mood = hour < 6 ? 'night' : hour < 8 ? 'dawn' : hour < 18 ? 'day' : hour < 21.5 ? 'dusk' : 'night'
    const root = document.documentElement
    root.dataset.mood = mood
    if (/[?&](p|labo)\b/.test(location.search)) return
    const src = `/accueil/posters/${matchMedia('(max-aspect-ratio: 1/1)').matches ? 'tall' : 'wide'}-${mood}.jpg`
    document.head.append(Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', href: src }))
    root.classList.add('poster')
    root.style.setProperty('--poster', `url(${src})`)
  })()
</script>

<body>

  <script type="module" src="/src/home/main.ts"></script>
