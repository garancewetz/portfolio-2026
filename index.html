<!-- The home page (its code: src/home/, see main.ts): the project badges, and behind them Garance's places in relief;
     hovering a badge leads to its place and writes its sentence and its links. The lab opens in the
     page itself (/lab/): the backdrop never reloads. The visible text is in French. -->
<script>
  // the light of the hour it is in Paris (see src/home/time-of-day.ts; ?hour=22 to try an hour), picked before anything
  // shows: arriving on the home page (not in the lab, nor by an old link to a project), the poster, an image of the sea of clouds
  // in that light, shows at once; the live backdrop fades over it
  ;(() => {
    const asked = new URLSearchParams(location.search).get('hour')
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date())
    const at = (type) => +parts.find((x) => x.type === type).value
    const hour = asked !== null && asked !== '' && !isNaN(+asked) ? +asked % 24 : at('hour') + at('minute') / 60
    const mood = hour < 6 ? 'night' : hour < 8 ? 'dawn' : hour < 18 ? 'day' : hour < 21.5 ? 'dusk' : 'night'
    const root = document.documentElement
    root.dataset.mood = mood
    if (/[?&](p|labo)\b/.test(location.search) || /^\/lab\/?$/.test(location.pathname)) return
    const shape = matchMedia('(max-aspect-ratio: 1/1)').matches ? 'tall' : 'wide'
    const src = `/accueil/posters/${shape}-${mood}.jpg`
    document.head.append(Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', href: src }))
    // while the poster is on its way (a slow connection), even before the page's styles: its own colours, top to
    // bottom, rather than a flat dark ground
    const bands = {
      'tall-dawn': '#2b46eb,#475ded,#bcc2fd,#c1c8fc,#bec5fc', 'tall-day': '#1414e6,#2c2cea,#9594fd,#a8a7fb,#a5a5fb',
      'tall-dusk': '#2a1691,#36209c,#684cd2,#8e7dd9,#8d7cd8', 'tall-night': '#151a92,#1b239c,#3946c8,#7179d3,#7279d3',
      'wide-dawn': '#566af0,#8894f6,#b7bdfd,#bbc2fc,#b9c0fb', 'wide-day': '#3a3aed,#6565f5,#8f8ffc,#9695fc,#9f9ffb',
      'wide-dusk': '#3d26a4,#5039bb,#644ad0,#6e55d3,#7d6ad3', 'wide-night': '#1f27a3,#2d36b5,#3845c7,#4450cb,#5d66ce',
    }
    root.classList.add('poster')
    root.style.setProperty('--poster', `url(${src})`)
    root.style.background = `linear-gradient(${bands[`${shape}-${mood}`]}) fixed`
  })()
</script>
</head>
<body>
  <canvas id="backdrop"></canvas>
  <script type="module" src="/src/home/main.ts"></script>
</body>
</html>
