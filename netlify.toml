# Déploiement sur Netlify (réglages lus automatiquement depuis le dépôt)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 demande Node 20.19+ ou 22.12+
  NODE_VERSION = "22"

# Les fichiers du build ont un nom qui change à chaque version : on peut les garder en cache longtemps
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les captures changent rarement : un mois de cache
[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
