# Deployment on Netlify (settings read automatically from the repository)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# The old Netlify address redirects to the domain (permanent redirect, the path is kept)
[[redirects]]
  from = "https://garancewetz.netlify.app/*"
  to = "https://garancewetz.dev/:splat"
  status = 301
  force = true

# The wwwetzel journey game (repository garancewetz/wwwetzel-journey) has its own Netlify site, hidden from the
# public: it is served here, under /journey (Netlify does not tell /journey from /journey/: a single rule)
[[redirects]]
  from = "/journey/*"
  to = "https://wwwetzel-journey.netlify.app/:splat"
  status = 200
  force = true

# The lab: /lab/, in the home page itself (the same page, served for this address)
# (Netlify does not tell /lab from /lab/: a single rule)
[[redirects]]
  from = "/lab"
  to = "/index.html"
  status = 200

# Its old address (/labo, then /?labo) leads there
[[redirects]]
  from = "/labo/*"
  to = "/lab/"
  status = 301

# The experiments live under /lab/, in English: their old addresses lead there
[[redirects]]
  from = "/toupies/*"
  to = "/lab/spinning-tops/:splat"
  status = 301

[[redirects]]
  from = "/feu/*"
  to = "/lab/fireworks/:splat"
  status = 301

[[redirects]]
  from = "/escalade/*"
  to = "/lab/climbing/:splat"
  status = 301

[[redirects]]
  from = "/ruban/*"
  to = "/lab/ribbon/:splat"
  status = 301

[[redirects]]
  from = "/vocalise/*"
  to = "/lab/ribbon/:splat"
  status = 301

[[redirects]]
  from = "/creatures/*"
  to = "/lab/creatures/:splat"
  status = 301

[[redirects]]
  from = "/mascottes/*"
  to = "/lab/mascots/:splat"
  status = 301

[[redirects]]
  from = "/murmuration/*"
  to = "/lab/murmuration/:splat"
  status = 301

[[redirects]]
  from = "/abyme/*"
  to = "/lab/abyme/:splat"
  status = 301

[[redirects]]
  from = "/morse/*"
  to = "/lab/morse/:splat"
  status = 301

[[redirects]]
  from = "/yaya/*"
  to = "/lab/yaya/:splat"
  status = 301

# Build files have a name that changes with each version: they can be cached for a long time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots rarely change: one month of cache
[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # (SAMEORIGIN rather than DENY: the site can show itself in an iframe, at the bottom of the Abyme page;
    # no other site can)
    X-Frame-Options = "SAMEORIGIN"
