# Déploiement sur Netlify (réglages lus automatiquement depuis le dépôt)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 demande Node 20.19+ ou 22.12+
  NODE_VERSION = "22"

# L'ancienne adresse Netlify renvoie vers le domaine (redirection permanente, le chemin est gardé)
[[redirects]]
  from = "https://garancewetz.netlify.app/*"
  to = "https://garancewetz.dev/:splat"
  status = 301
  force = true

# Le jeu wwwetzel journey (dépôt garancewetz/wwwetzel-journey) a son propre site Netlify, que le public ne voit pas :
# on le sert ici, sous /journey (Netlify ne distingue pas /journey de /journey/ : une seule règle)
[[redirects]]
  from = "/journey/*"
  to = "https://wwwetzel-journey.netlify.app/:splat"
  status = 200
  force = true

# Les fichiers du build ont un nom qui change à chaque version : on peut les garder en cache longtemps
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les captures changent rarement : un mois de cache
[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # (SAMEORIGIN plutôt que DENY : le site peut se montrer lui-même dans une iframe, au fond de la page Abyme ;
    # aucun autre site ne le peut)
    X-Frame-Options = "SAMEORIGIN"
